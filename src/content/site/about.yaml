heading: 写代码，也写下生活。
paragraphs:
  - 我是软件工程师。这是我的个人网站，也是记录心理治疗心得的地方。
  - 这里可以容纳不同面向的我：生活中的思考、技术中的探索，还有正在形成的作品。内容会随着生活慢慢生长。
