heading_en: Writing code, and writing down life.
paragraphs_en:
  - I'm a software engineer. This is my personal website, and the place where I keep notes from therapy.
  - There's room here for different sides of me — thoughts from everyday life, things I'm exploring in tech, and work that's still taking shape. It will grow as life does.
